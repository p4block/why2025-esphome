# Initial serial-only ESPHome smoke test for the official WHY2025 badge.
# No display, Wi-Fi, or Home Assistant connection is configured yet.
# This revision requires engineering_sample: true.
# Confirmed via esptool flash-id: 16MB external flash.
esphome:
  name: whybadge
  friendly_name: WHY2025 Badge
  min_version: 2026.9.1

esp32:
  variant: esp32p4
  engineering_sample: true
  flash_size: 16MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    version: 5.5.5

logger:
  hardware_uart: UART0
  baud_rate: 115200

interval:
  - interval: 10s
    then:
      - logger.log: "WHY2025 ESPHome serial smoke test is running"
