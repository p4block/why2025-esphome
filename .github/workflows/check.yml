name: Check badge firmware
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python tools/setup_secrets.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: c++ -std=c++17 tests/test_input_core.cpp -o /tmp/whybadge-input-test
      - run: /tmp/whybadge-input-test
      - run: esphome config whybadge.yaml > /dev/null
      - run: esphome compile whybadge.yaml
